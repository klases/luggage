name: common-review
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
jobs:
  approval:
    runs-on: ubuntu-latest
    steps:
      - name: Changes to common/ need approval from someone other than the author
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if ! gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' | grep -q '^common/'; then
            echo "No changes to common/."
            exit 0
          fi
          approvers=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate | jq -rs --arg author "$AUTHOR" '
            add | map(select(.user.login != $author and .state != "COMMENTED"))
            | group_by(.user.login) | map(last) | map(select(.state == "APPROVED")) | .[].user.login')
          if [ -z "$approvers" ]; then
            echo "::error::This PR changes common/ and has no approval from someone other than $AUTHOR."
            exit 1
          fi
          echo "Approved by: $approvers"
